name: Installer verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - name: Build the release binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/phantomguard ./cmd/phantomguard
      - name: Install without Go or sudo
        run: |
          destination="$(mktemp -d)/bin"
          sh ./installer/install.sh --source /tmp/phantomguard --install-dir "$destination"
          "$destination/phantomguard" --help

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - name: Build the release binary
        shell: pwsh
        run: go build -trimpath -ldflags="-s -w" -o "$env:RUNNER_TEMP\phantomguard.exe" ./cmd/phantomguard
      - name: Install without Go or administrator privileges
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'phantomguard-bin'
          .\installer\install.ps1 -SourcePath (Join-Path $env:RUNNER_TEMP 'phantomguard.exe') -InstallDir $destination -NoPathUpdate
          & (Join-Path $destination 'phantomguard.exe') --help

  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - name: Build the release binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/phantomguard/phantomguard/pkg/buildinfo.Version=v0.1.3" -o /tmp/phantomguard ./cmd/phantomguard
      - name: Install without Go or sudo
        run: |
          destination="$(mktemp -d)/bin"
          sh ./installer/install.sh --source /tmp/phantomguard --install-dir "$destination"
          "$destination/phantomguard" --help
