[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantomguard"
version = "0.1.0"
description = "Static pre-commit scanner for phantom Python and npm dependencies"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PhantomGuard contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
phantomguard = "phantomguard.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["phantomguard*"]

[tool.setuptools.package-data]
phantomguard = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
